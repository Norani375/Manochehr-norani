name: Synchronize compliance officer data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-compliance-officer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Synchronize compliance officer and migrate stale saved data
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/OrgChartCanvas.tsx')
          text = path.read_text(encoding='utf-8')

          marker = "const DEFAULT_ORG_CHART_DATA: OrgChartData = {"
          helper = """const COMPLIANCE_OFFICER_CANONICAL: Partial<OrgChartNode> = {\n  name: 'عبدالعزیز مهرزاد',\n  title: 'مسئول پیروی از قوانین (Compliance Officer)',\n  phone: '',\n  email: '',\n  joinDate: '',\n  education: 'لیسانس اداره و تجارت',\n  experience: 'مسئول مستقل پیروی از قوانین و مقررات و AML/CFT',\n  tazkiraNo: '72198-0300-1401',\n  location: 'دفتر مرکزی - واحد پیروی از قوانین و مقررات',\n};\n\nconst normalizeOrgChartData = (value: OrgChartData): OrgChartData => ({\n  ...value,\n  executives: value.executives.map((executive) =>\n    executive.title.includes('مسئول پیروی از قوانین')\n      ? { ...executive, ...COMPLIANCE_OFFICER_CANONICAL }\n      : executive\n  ),\n});\n\n"""
          if "const COMPLIANCE_OFFICER_CANONICAL" not in text:
              text = text.replace(marker, helper + marker, 1)

          text = text.replace(
              "if (saved) return { ...DEFAULT_ORG_CHART_DATA, ...JSON.parse(saved) };",
              "if (saved) return normalizeOrgChartData({ ...DEFAULT_ORG_CHART_DATA, ...JSON.parse(saved) });"
          )
          text = text.replace(
              "setData({ ...DEFAULT_ORG_CHART_DATA, ...JSON.parse(saved) });",
              "setData(normalizeOrgChartData({ ...DEFAULT_ORG_CHART_DATA, ...JSON.parse(saved) }));"
          )
          text = text.replace(
              "setData((prev) => ({ ...prev, ...remote.orgChartData }));",
              "setData((prev) => normalizeOrgChartData({ ...prev, ...remote.orgChartData }));"
          )

          # Also repair any remaining visible fallback text.
          text = text.replace('محمد فهیم', 'عبدالعزیز مهرزاد')

          path.write_text(text, encoding='utf-8')

          # Keep the main page canonical too.
          page = Path('app/page.tsx')
          page_text = page.read_text(encoding='utf-8')
          page_text = page_text.replace("name: 'محمد فهیم ولد محمد امان'", "name: 'عبدالعزیز مهرزاد ولد عبدالخلیل'")
          page_text = page_text.replace("id: '97484'", "id: '72198-0300-1401'")
          page.write_text(page_text, encoding='utf-8')

      - name: Commit synchronized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OrgChartCanvas.tsx app/page.tsx
          git diff --cached --quiet && echo "No changes required" && exit 0
          git commit -m "fix(dab): make compliance officer canonical in all views"
          git push
