name: Synchronize compliance officer data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-compliance-officer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace legacy compliance officer data
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "components/OrgChartCanvas.tsx": [
                  ("name: 'محمد فهیم'", "name: 'عبدالعزیز مهرزاد'"),
                  ("phone: '0785445060'", "phone: ''"),
                  ("email: 'compliance@exchange.af'", "email: ''"),
                  ("joinDate: '1401/06/20'", "joinDate: ''"),
                  ("education: 'لیسانس اقتصاد با تصدیق‌نامه AML/CFT'", "education: 'لیسانس اداره و تجارت'"),
                  ("experience: '5 سال مسئولیت انطباق با مقررات مبارزه با پولشویی و تأمین مالی تروریسم'", "experience: 'مسئول مستقل پیروی از قوانین و مقررات و AML/CFT'"),
                  ("tazkiraNo: '0032198-0102-87654'", "tazkiraNo: '72198-0300-1401'"),
                  ("location: 'دفتر مرکزی - واحد انطباق (AML/CFT)'", "location: 'دفتر مرکزی - واحد پیروی از قوانین و مقررات'"),
              ],
              "app/page.tsx": [
                  ("name: 'محمد فهیم ولد محمد امان'", "name: 'عبدالعزیز مهرزاد ولد عبدالخلیل'"),
                  ("id: '97484'", "id: '72198-0300-1401'"),
              ],
          }

          changed = False
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed = True

          if not changed:
              print('No legacy compliance officer values found. Nothing to commit.')
              raise SystemExit(0)

      - name: Commit synchronized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OrgChartCanvas.tsx app/page.tsx
          git commit -m "fix(dab): replace legacy compliance officer everywhere"
          git push

      # This workflow is temporary. Remove it after the synchronization commit.
